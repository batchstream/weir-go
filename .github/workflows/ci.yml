name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The SDK uses a released protocol, replaces nothing and does not depend on the server
        run: |
          forbidden=$(go list -m -f '{{if or .Replace (eq .Path "github.com/batchstream/weir")}}{{.Path}}{{end}}' all)
          echo "$forbidden"
          test -z "$forbidden"
          protocol=$(go list -m -f '{{.Version}}' github.com/batchstream/weir-protocol)
          echo "$protocol"
          [[ $protocol =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: Tests, vet and formatting
        run: |
          go mod tidy -diff
          go test -race -count=1 -timeout=90s -cover ./...
          go test -tags integration -run '^$' ./...
          go vet ./...
          go vet -tags integration ./...
          test -z "$(gofmt -l .)"
