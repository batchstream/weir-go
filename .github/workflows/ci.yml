name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Offline tests and vet
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go mod verify
          go test -race -count=1 -timeout=90s -cover ./...
          go test -tags integration -run '^$' ./...
          go vet ./...
          go vet -tags integration ./...
          python3 -m unittest discover -s scripts -p '*_test.py' -v
          python3 scripts/check_dependencies.py
          test -z "$(gofmt -l .)"
          git diff --exit-code
