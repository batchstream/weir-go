name: SDK release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Stable release tag (vMAJOR.MINOR.PATCH)
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: go mod download
      - name: Validate release source
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go test -race -count=1 -timeout=90s ./...
          go vet ./...
          python3 -m unittest discover -s scripts -p '*_test.py' -v
          git diff --exit-code
      - name: Publish immutable tag and verify external installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py
